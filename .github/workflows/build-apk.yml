
name: Build BankKala APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name 'BankKalaAndroid-phone-build*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"

      - name: Build APK
        run: gradle -p BankKalaAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BankKala-APK
          path: BankKalaAndroid/app/build/outputs/apk/debug/app-debug.apk
